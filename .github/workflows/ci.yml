name: CI

on:
  pull_request:
  # Pushes to `main` are already built by the deploy workflow.
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest run per branch or PR is interesting.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, type-check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      # `build` runs `astro check` first, so this covers types and the build.
      - name: Type-check and build
        run: pnpm build
